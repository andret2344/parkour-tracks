# Every text of ParkourTracks, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Words in <angle brackets> such as <track> are placeholders filled in by the plugin.
# A message missing from this file is taken from the plugin's own copy.

selection-incomplete: '<red>Select a region with WorldEdit first.'
selection-not-cuboid: '<red>Only cuboid selections are supported.'
track-not-found: '<red>There is no track named <name>.'
track-running: '<red>Track <track> is running. Stop it before changing it.'
name-invalid: '<red>A track name can have 1-32 letters, digits, "_" and "-", not "<name>".'
name-taken: '<red>A track named <name> already exists.'
region-overlap: '<red>The region overlaps the region of track <other>.'
region-leaves-out: '<red>The region has to contain the spawn, the finish, the checkpoints and the walls of <track>.'
placement-other-world: '<red>Select it, and stand, in the world of the track, <world>.'
placement-outside-region: '<red>The selection has to lie wholly inside the region of track <track>.'
placement-spot-outside-area: '<red>Stand inside the selection: players coming back here land where you stand.'
position-invalid: '<red>The position has to be between 1 and <max>.'
created: '<green>Created track <track>.'
removed: '<green>Removed track <track>. Its results are kept.'
renamed: '<green>Renamed track <old> to <track>.'
region-set: '<green>Set the region of track <track>.'
spawn-set: '<green>Set the spawn of track <track>.'
finish-set: '<green>Set the finish of track <track>.'
checkpoint-added: '<green>Added checkpoint <position> to track <track>.'
checkpoint-set: '<green>Set checkpoint <position> of track <track>.'
checkpoint-removed: '<green>Removed checkpoint <position> of track <track>.'
wall-added: '<green>Added wall <position> to track <track>.'
wall-set: '<green>Set wall <position> of track <track>.'
wall-removed: '<green>Removed wall <position> of track <track>.'
option-not-found: '<red>There is no option <option>. Options: <options>.'
option-set: '<green>Set <option> of track <track> to <value>.'
option-not-a-boolean: '<red><option> has to be true or false.'
option-not-a-number: '<red><option> has to be a number.'
option-out-of-range: '<red><option> has to be <range>.'
option-not-a-choice: '<red><option> has to be one of: <choices>.'
option-not-a-permission: '<red><option> has to be a permission node such as tracks.vip, or none.'
option-conflict: '<red><option> cannot be turned on together with <other>.'
medal-not-found: '<red>There is no medal <medal>. Medals: <medals>.'
medal-time-invalid: '<red>The time has to be a positive number of seconds, such as 30.5.'
medal-time-set: '<green>Set the time of <medal> on track <track> to <time>.'
medal-order: '<red>A better medal needs a shorter time: the time clashes with <medal>.'
medal-reward-invalid: '<red>The reward has to be a number, 0 or more.'
medal-reward-set: '<green>Set the reward of <medal> on track <track> to <reward>.'
medal-removed: '<green>Removed <medal> from track <track>.'
effect-not-found: '<red>There is no effect <effect>.'
effect-set: '<green>Players on track <track> get <effect> <level>.'
effect-removed: '<green>Players on track <track> no longer get <effect>.'
effect-not-on-track: '<red>Track <track> has no effect <effect>.'
author-unknown-player: '<red>No player named <player> has ever played on this server.'
author-not-players-type: '<red>Only tracks of type players have authors. Set the type with /ptracks set <track> type players.'
author-already: '<red><player> is already an author of track <track>.'
author-added: '<green>Added <player> to the authors of track <track>.'
author-not-author: '<red><player> is not an author of track <track>.'
author-removed: '<green>Removed <player> from the authors of track <track>.'
lobby-set: '<green>Set the lobby.'
lobby-inside-track: '<red>The lobby cannot lie inside track <track>: players sent there would enter it.'
track-lobby-set: '<green>Set the own lobby of track <track>.'
track-lobby-cleared: '<green>Track <track> uses the global lobby again.'
started: '<green>Started track <track>.'
stopped: '<green>Stopped track <track>.'
already-running: '<red>Track <track> is already running.'
not-running: '<red>Track <track> is not running.'
cannot-start: '<red>Track <track> cannot start yet, it misses: <missing>.'
missing-spawn: 'the spawn (/ptracks spawn)'
missing-finish: 'the finish (/ptracks finish)'
missing-lobby: 'the lobby (/ptracks setlobby)'
reloaded: '<green>Reloaded the config and the messages.'
reload-failed: '<red>The files are invalid and were not reloaded: <error>'
list-empty: '<gray>There are no tracks yet. Create one with /ptracks create.'
list-header: '<gold>Tracks:'
list-entry: '<gray>- <white><track></white> (<display-name><gray>), <state>'
state-running: '<green>running'
state-stopped: '<red>stopped'
info-header: '<gold>Track <white><track></white> (<display-name><gold>), <state>'
info-type: '<gray>Type: <white><type>'
info-region: '<gray>Region: <white><world> <from> to <to>'
info-spawn: '<gray>Spawn: <value>'
info-finish: '<gray>Finish: <value>'
info-checkpoints: '<gray>Checkpoints between them: <white><count>'
info-walls: '<gray>Walls: <white><count>'
info-lobby: '<gray>Own lobby: <value>'
info-options: '<gold>Options (/ptracks set <track> \<option> \<value>):'
info-option: '<gray>- <option>: <white><value>'
info-medals: '<gold>Medals (/ptracks medal time|reward <track> \<medal> \<value>):'
info-medal: '<gray>- <medal><gray>: <white><time></white>, reward <white><reward>'
info-effects: '<gold>Effects: <white><effects>'
info-effect: '<effect> <level>'
info-authors: '<gold>Authors: <white><authors>'
info-missing: '<red>Missing before it can start:'
info-missing-entry: '<red>- <missing>'
info-ready: '<green>Ready to start.'
value-set: '<white>set'
value-not-set: '<red>not set'
value-none: 'none'
