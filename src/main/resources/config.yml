# The medals of every track, best first. Each track sets its own time and reward for them with a command.
# The key identifies a medal, in commands and in the record of paid rewards: renaming a key makes a new medal,
# which is paid again. The value is the name shown to players, in MiniMessage
# (https://docs.advntr.dev/minimessage/format.html).
medals:
  platinum: '<aqua>Platinum'
  gold: '<gold>Gold'
  silver: '<gray>Silver'
  bronze: '<#cd7f32>Bronze'

# How many seconds a player who reached the finish waits before being sent to the lobby (for tracks whose
# afterFinish option is lobby). 0 sends them right away.
finish-delay: 5

# Where the running time of a run is shown: action-bar (the text above the hotbar), xp-bar (the level shows the
# seconds) or both. The experience a player had is given back when they leave.
timer-display: action-bar

# How many ticks (20 per second) a player on a track with sprintForced may stop sprinting outside a checkpoint before
# being sent back. A little leeway keeps a sprint broken by bumping into a block from counting.
sprint-grace-ticks: 5

# The items players get in the hotbar during a game. slot is 0-8 (0 is the leftmost); set enabled to false to
# leave an item out. Their names are in messages.yml.
game-items:
  back:
    enabled: true
    slot: 0
    material: slime_ball
  restart:
    enabled: true
    slot: 1
    material: clock
  menu:
    enabled: true
    slot: 4
    material: compass
  hide:
    enabled: true
    slot: 7
    material: ender_eye
  exit:
    enabled: true
    slot: 8
    material: red_bed

# Whether players in a game see a sidebar with their best time, the record and their medal. Turn it off when another
# plugin shows a sidebar. The texts are in messages.yml; an empty text leaves its line out.
scoreboard: true

# Every how many minutes the tracks and the results are copied to backups/; 0 turns backups off.
backup-frequency: 1440
# How many of the newest backups are kept; older ones are deleted.
backup-keep: 10

# Fees and rewards need Vault and an economy plugin; without them tracks are free and pay nothing.
# Whether players get their fee back when an admin stops the track they are on.
refund-on-stop: true
