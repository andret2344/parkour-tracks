# Database connection details, it's required to store times on parkour games
database:
  # If any connection to database should be established.
  # Type: Boolean
  # Default: false
  enabled: false
  # The url of database
  # Type: String
  # Default: ''
  url: localhost
  # The username to use the database
  # Type: String
  # Default: root
  user: root
  # The password for user to database
  # Type: String
  # Default: ''
  pass: ''
  # Database name
  # Type: String
  # Default: ats_parkour
  dbname: ats_parkour

# The details of sign with parkour game best record template text
# Every line has the same rules.
# Type: String
# Default: ''
recordSign:
  line1: '&2&lRECORD'
  line2: '%PERSONAL_TIME%'
  line3: '%NICK%'
  line4: ''

# Configurable medals for every parkour
# Type: List of medals
# Default: []
medal:
  # The key is used in commands, etc
  platinum:
    # The display is used on chat for players and admins
    # Type string
    # Default: key equivalent
    display: '&fplatinum'
    # The lowest importance, the "better" medal is. Paradoxically, 1 > 2 > 3 > 4!
    # Type: Integer
    # Default: 1
    importance: 1
  gold:
    display: '&egold'
    importance: 2
  silver:
    display: '&7silver'
    importance: 3
  bronze:
    display: '&4bronze'
    importance: 4

# If setting up all parkour medals is required to start the game.
# Possible options:
# NONE - no requirements
# TIME - require only time
# ALL - require time and money
# If no financial provider available, TIME and ALL are identity.
# Type: NONE|TIME|ALL
# Default: ALL
require-medals: ALL

# Should it be forbidden to everyone to edit running parkour games?
# This setting forbids any terrain changes and game modification via commends.
# If set to true, you need to stop the game in order to apply any modification it.
# There's no bypass permission for it.
# Type: Boolean
# Default: true
edit-lock: true

# To prevent data loss, it's highly recommended to set backup frequency.
# Configure every how many minutes the backup should be created.
# Time is counted since every server start.
# Any non-positive (lower or equal to 0) number is treated as no backups.
# Type: Long
# Default: 1440 (24 hours)
backup-frequency: 1440

# All possible sounds are listed here:
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
sound:
  join: NONE
  start: BLOCK_LEVER_CLICK
  checkpoint: NONE
  complete: ENTITY_PLAYER_LEVELUP
  leave: NONE

# How many seconds' player has to wait after entering last checkpoint (completing parkour),
# before being automatically teleported to lobby.
# Any non-positive (lower or equal to 0) number is treated as invalid and forces default to be used.
# Type: Integer
# Default: 5
teleportation-timeout: 5

# Following section will be important only if FinancialProvider is configured.
economy:
  # Pattern compliant with following instruction: https://docs.oracle.com/en/java/javase/11/docs/api/java.base/java/text/DecimalFormat.html
  # Type: String
  # Default: '+###,##0.00¤;-###,##0.00¤'
  pattern: '+###,##0.00¤;-###,##0.00¤'
  # Type: String
  # Default: '{@}'
  currency-symbol: '{@}'
  # Type: char
  # Default: '.'
  decimal-separator: '.'
  # Type: char
  # Default: ' '
  group-separator: ' '
  # Type: Integer
  # Default: 3
  grouping-size: 3
