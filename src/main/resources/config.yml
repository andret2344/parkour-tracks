# The medals of every track, best first. Each track sets its own time and reward for them with a command.
# The key identifies a medal, in commands and in the record of paid rewards: renaming a key makes a new medal,
# which is paid again. The value is the name shown to players, in MiniMessage
# (https://docs.advntr.dev/minimessage/format.html).
medals:
  platinum: '<aqua>Platinum'
  gold: '<gold>Gold'
  silver: '<gray>Silver'
  bronze: '<#cd7f32>Bronze'

# How many seconds a player who reached the finish waits before being sent to the lobby (for tracks whose
# afterFinish option is lobby). 0 sends them right away.
finish-delay: 5

# Where the running time of a run is shown: action-bar (the text above the hotbar), xp-bar (the level shows the
# seconds) or both. The experience a player had is given back when they leave.
timer-display: action-bar
