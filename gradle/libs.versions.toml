[versions]
java = "25"
paper = "26.2.build.130-stable"
jetbrains-annotations = "26.1.0"
lamp = "4.0.0-rc.18"
worldedit = "7.4.5"
assertj = "3.27.7"
mockbukkit = "4.116.1"
junit = "6.1.3"
jacoco = "0.8.15"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
lamp-common = { module = "io.github.revxrsal:lamp.common", version.ref = "lamp" }
lamp-bukkit = { module = "io.github.revxrsal:lamp.bukkit", version.ref = "lamp" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
jacocolog = { id = "org.barfuin.gradle.jacocolog", version = "4.0.2" }
changelog = { id = "org.jetbrains.changelog", version = "2.5.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
