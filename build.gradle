apply plugin: "java"
apply plugin: "idea"

jar {
	setArchiveBaseName "atsStoneGenerator"
	setArchiveVersion "2.0"
}

sourceCompatibility = JavaVersion.VERSION_12
targetCompatibility = JavaVersion.VERSION_12

tasks.withType(JavaCompile) {
//	options.compilerArgs << '-Xlint:unchecked'
//	options.deprecation = true
}

repositories {
	mavenCentral()
	maven {
		url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
		content {
			includeGroup 'org.bukkit'
			includeGroup 'org.spigotmc'
		}
	}
	maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url "http://maven.sk89q.com/artifactory/repo" }
}

dependencies {
	compileOnly group: 'com.sk89q.worldedit', name: 'worldedit-bukkit', version: '6.1.4-SNAPSHOT'
	compileOnly group: 'com.sk89q.worldedit', name: 'worldedit-core', version: '6.1.4-SNAPSHOT'
	compile group: 'org.json', name: 'json', version: '20180813'
	compileOnly 'org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT'
	compileOnly group: "org.projectlombok", name: "lombok", version: "1.18.8"
	annotationProcessor group: "org.projectlombok", name: "lombok", version: "1.18.8"
}
