 */

plugins {
	id 'idea'
	id 'java'
	id 'jacoco'
	id 'maven-publish'
	id 'org.barfuin.gradle.jacocolog' version '3.1.0'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'kr.entree.spigradle' version '2.4.3'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
	mavenLocal()
	mavenCentral()
	spigot()
	maven { url 'https://gitlab.com/api/v4/projects/12063927/packages/maven' }
	maven { url 'https://maven.enginehub.org/repo/' }
}

dependencies {
	compileOnly group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
	compileOnly group: 'com.sk89q.worldedit', name: 'worldedit-bukkit', version: '7.2.9'
	compileOnly group: 'org.jetbrains', name: 'annotations', version: '23.0.0'
	compileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: "${spigotVersion}-R0.1-SNAPSHOT"
	implementation group: 'eu.andret', name: 'ats-arguments', version: argumentsVersion
	implementation group: 'org.bstats', name: 'bstats-bukkit', version: '3.0.0'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion

	testCompileOnly group: 'org.jetbrains', name: 'annotations', version: '23.0.0'
	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
	testImplementation group: 'com.sk89q.worldedit', name: 'worldedit-bukkit', version: '7.2.9'
	testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.23.1'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '4.8.1'
	testImplementation group: 'org.mockito', name: 'mockito-inline', version: '4.8.1'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: "${spigotVersion}-R0.1-SNAPSHOT"
	testImplementation group: 'org.testng', name: 'testng', version: '7.6.1'
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'
compileTestJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'

spigot {
	authors = ['Andret']
	apiVersion = '1.17'
	description = 'A plugin to create and play parkours.'
	version = project.version
	depends = ['WorldEdit']
	libraries = ['com.google.code.gson:gson:2.9.0']

	//noinspection GroovyAssignabilityCheck
	commands {
		parkour {
			aliases = ['pk']
			description = 'The atsParkour command'
		}
	}

	//noinspection GroovyAssignabilityCheck
	permissions {
		'ats.parkour.*' {
			children = [
					'ats.parkour.help'           : true,
					'ats.parkour.create'         : true,
					'ats.parkour.remove'         : true,
					'ats.parkour.rename'         : true,
					'ats.parkour.info'           : true,
					'ats.parkour.setSpawn'       : true,
					'ats.parkour.recreate'       : true,
					'ats.parkour.start'          : true,
					'ats.parkour.stop'           : true,
					'ats.parkour.addCheckpoint'  : true,
					'ats.parkour.setCheckpoint'  : true,
					'ats.parkour.addWall'        : true,
					'ats.parkour.setWall'        : true,
					'ats.parkour.list'           : true,
					'ats.parkour.ignore'         : true,
					'ats.parkour.sprintForced'   : true,
					'ats.parkour.alwaysSpawn'    : true,
					'ats.parkour.savingResults'  : true,
					'ats.parkour.ignoreRecords'  : true,
					'ats.parkour.damageAllowed'  : true,
					'ats.parkour.effects'        : true,
					'ats.parkour.setEffect'      : true,
					'ats.parkour.boat'           : true,
					'ats.parkour.enabled'        : true,
					'ats.parkour.modifyInventory': true,
					'ats.parkour.recordsBlock'   : true,
					'ats.parkour.teleportBlock'  : true,
					'ats.parkour.teleport'       : true,
					'ats.parkour.fix'            : true,
					'ats.parkour.color'          : true,
					'ats.parkour.difficulty'     : true,
					'ats.parkour.type'           : true,
					'ats.parkour.displayName'    : true,
					'ats.parkour.authors'        : true,
					'ats.parkour.vip'            : true,
					'ats.parkour.bronze'         : true,
					'ats.parkour.silver'         : true,
					'ats.parkour.gold'           : true,
					'ats.parkour.platinum'       : true,
			]
		}
	}
}

test {
	useTestNG()
	finalizedBy jacocoTestCoverageVerification, jacocoAggregatedReport
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0
			}
		}
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options {
		setMemberLevel JavadocMemberLevel.PUBLIC
		setAuthor true

		links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
	}
}

task sourceJar(type: Jar) {
	archiveClassifier.set('sources')
	from file('build/delombok')
}

task packageJavadoc(type: Jar) {
	archiveClassifier.set('javadoc')
	from javadoc
}

publishing {
	publications {
		//noinspection GroovyAssignabilityCheck
		library(MavenPublication) {
			from components.java
			artifact tasks.sourceJar
			artifact tasks.packageJavadoc
			groupId = project.group
			version = project.version
			artifactId = project.codeName
		}
	}
	repositories {
		maven {
			url 'https://gitlab.com/api/v4/projects/6426481/packages/maven'
			credentials(HttpHeaderCredentials) {
				name = 'Job-Token'
				value = System.getenv('CI_JOB_TOKEN')
			}
			authentication {
				//noinspection GroovyAssignabilityCheck
				header(HttpHeaderAuthentication)
			}
		}
	}
}

shadowJar {
	archiveFileName = "${project.name}-${project.version}.jar"
	relocate 'eu.andret.arguments', 'eu.andret.ats.parkour.arguments'
	relocate 'org.bstats', 'eu.andret.ats.parkour.bstats'
	project.configurations.implementation.canBeResolved = true
	configurations = [project.configurations.implementation]
}

build.dependsOn(shadowJar)

tasks.register('spigotVersion') {
	doLast {
		println(spigotVersion)
	}
}

tasks.register('argumentsVersion') {
	doLast {
		println(argumentsVersion)
	}
}
