image: gradle:8-jdk17-alpine

before_script:
  - chmod a+x gradlew

stages:
  - build
  - verify
  - deploy

build:
  stage: build
  script:
    - ./gradlew jar
  artifacts:
    paths:
      - build/libs/*.jar
    when: always

testng:
  stage: verify
  script:
    - ./gradlew test
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  when: on_success
  artifacts:
    reports:
      junit: build/test-results/test/**.xml

publish:
  stage: deploy
  script:
    - ./gradlew clean publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  allow_failure: true

badges:
  stage: deploy
  script:
    - apt-get -qq update
    - apt-get -qq install python3 python3-pip --yes
    - pip3 install anybadge
    - ./gradlew build -q
    - anybadge -l spigot -v "$(./gradlew spigotVersion -q)" -f spigot.svg -c "#007ec6"
    - anybadge -l atsArguments -v "$(./gradlew argumentsVersion -q)" -f arguments.svg -c "#007ec6"
  artifacts:
    paths:
      - version.svg
      - spigot.svg
      - arguments.svg
    expire_in: 4 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
